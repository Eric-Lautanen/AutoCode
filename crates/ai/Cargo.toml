[package]
name = "autocode-ai"
version.workspace = true
edition.workspace = true

[dependencies]
autocode-core = { path = "../core" }
autocode-fs = { path = "../fs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
egui = "0.34"
