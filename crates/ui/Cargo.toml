[package]
name = "autocode-ui"
version.workspace = true
edition.workspace = true

[dependencies]
autocode-core = { path = "../core" }
autocode-ai = { path = "../ai" }
autocode-fs = { path = "../fs" }
eframe = { version = "0.34", default-features = false, features = ["persistence", "glow", "wgpu", "x11", "wayland"] }
egui = "0.34"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
rfd = "0.17.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = "1"
