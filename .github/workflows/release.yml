name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95
          target: x86_64-pc-windows-msvc
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - run: Compress-Archive -Path target/x86_64-pc-windows-msvc/release/autocode.exe -DestinationPath autocode-x86_64-pc-windows-msvc.zip
      - uses: actions/upload-artifact@v4
        with:
          name: autocode-windows
          path: autocode-x86_64-pc-windows-msvc.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev
      - run: cargo build --release
      - run: tar czf autocode-x86_64-unknown-linux-gnu.tar.gz -C target/release autocode
      - uses: actions/upload-artifact@v4
        with:
          name: autocode-linux
          path: autocode-x86_64-unknown-linux-gnu.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95
      - run: cargo build --release
      - run: tar czf autocode-aarch64-apple-darwin.tar.gz -C target/release autocode
      - uses: actions/upload-artifact@v4
        with:
          name: autocode-macos
          path: autocode-aarch64-apple-darwin.tar.gz

  create-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - run: |
          mkdir release-assets
          cp autocode-windows/autocode-x86_64-pc-windows-msvc.zip release-assets/
          cp autocode-linux/autocode-x86_64-unknown-linux-gnu.tar.gz release-assets/
          cp autocode-macos/autocode-aarch64-apple-darwin.tar.gz release-assets/
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
