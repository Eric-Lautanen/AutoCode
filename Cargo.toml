[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/ai",
    "crates/fs",
    "crates/ui",
    "crates/autocode",
]

[workspace.package]
version = "0.2.3"
edition = "2024"
rust-version = "1.95"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev]
opt-level = 1
